# Role registry — the single source of truth for how each agent is launched.
#
# Profiles live beside this file as <role>.md and carry doctrine only.
# Launch configuration lives here and nowhere else: never in ~/.codex/config.toml,
# never in .claude/agents/, never duplicated into a profile's frontmatter.
#
# How these fields become flags:
#   claude  --model <model>              # CLAUDE_EFFORT carries effort
#   codex   -c model="<model>" -c model_reasoning_effort="<effort>"
#   agy     --model <model>               # gemini-* ids already encode the level
#
# layer:
#   1   the coordinator itself
#   2a  one-shot call, no supervised worker, no lifecycle
#   2b  supervised Orca orchestration worker, --worktree current
#   3   council, human-triggered only

[settings]
# The codex weekly limit ran out on 2026-08-18. While this is false, every role
# that declares a [roles.<name>.fallback] block runs that block instead.
# Flip to true when the limit resets — that is the whole reversal.
codex_available = false


# ---------------------------------------------------------------- coordinator

[roles.orchestrator]
cli     = "claude"
model   = "fable"
effort  = "high"
layer   = "1"
profile = "orchestrator.md"


# ------------------------------------------------------------- codex-first
# Preferred vendor is codex; each carries a claude fallback for the outage.

[roles.analyst]
cli     = "codex"
model   = "gpt-5.6-sol"
effort  = "xhigh"
layer   = "2b"
profile = "analyst.md"
[roles.analyst.fallback]
cli     = "claude"
model   = "opus"
effort  = "high"

[roles.architect]
cli     = "codex"
model   = "gpt-5.6-sol"
effort  = "xhigh"
layer   = "2b"
profile = "architect.md"
[roles.architect.fallback]
cli     = "claude"
model   = "opus"
effort  = "high"

[roles.reviewer]
cli     = "codex"
model   = "gpt-5.6-sol"
effort  = "high"
layer   = "2b"
profile = "reviewer.md"
[roles.reviewer.fallback]
cli     = "claude"
model   = "opus"
effort  = "high"

[roles.safety]
cli     = "codex"
model   = "gpt-5.6-sol"
effort  = "xhigh"
layer   = "2b"
profile = "safety.md"
[roles.safety.fallback]
cli     = "claude"
model   = "opus"
effort  = "high"

[roles.test-verifier]
cli     = "codex"
model   = "gpt-5.6-sol"
effort  = "high"
layer   = "2b"
profile = "test-verifier.md"
[roles.test-verifier.fallback]
cli     = "claude"
model   = "opus"
effort  = "high"


# ------------------------------------------------------------------ agy-first

[roles.interface-auditor]
cli     = "agy"
model   = "gemini-3.1-pro-high"
effort  = ""
layer   = "2b"
profile = "interface-auditor.md"

[roles.field-test]
cli     = "agy"
model   = "gemini-3.1-pro-high"
effort  = ""
layer   = "2b"
profile = "field-test.md"

[roles.scribe]
cli     = "agy"
model   = "gemini-3.1-pro-high"
effort  = ""
layer   = "2a"
profile = "scribe.md"

# Cheap tier: summarising, classifying, drafting. No profile — the dispatch
# spec is the whole brief.
[roles.helper]
cli     = "agy"
model   = "gemini-3.7-flash-high"
effort  = ""
layer   = "2a"
profile = ""


# --------------------------------------------------------------- implementers

[roles.implementer-pi]
cli     = "claude"
model   = "opus"
effort  = "high"
layer   = "2b"
profile = "implementer-pi.md"

[roles.implementer-xavier]
cli     = "claude"
model   = "opus"
effort  = "high"
layer   = "2b"
profile = "implementer-xavier.md"


# -------------------------------------------------------------------- council
# Two different vendors on purpose: different blind spots. Runs only on
# explicit human request.

[roles.council-a]
cli     = "claude"
model   = "opus"
effort  = "high"
layer   = "3"
profile = ""

[roles.council-b]
cli     = "codex"
model   = "gpt-5.6-sol"
effort  = "xhigh"
layer   = "3"
profile = ""
# Falls back to agy, NOT claude: a claude-vs-claude council defeats the point.
[roles.council-b.fallback]
cli     = "agy"
model   = "gemini-3.1-pro-high"
effort  = ""
